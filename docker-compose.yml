version: '3.8'

services:
  prompt:
    image: relimc/prompt:latest   # 使用 Docker Hub 上的预构建镜像
    container_name: prompt
    ports:
      - "8000:8000"
    volumes:
      - /opt/containers/prompt/data:/app/data
    environment:
      - SECRET_KEY=your-strong-random-secret-key-change-this  # 请替换为强密钥
      - ADMIN_USERNAME=admin                                   # 管理员用户名
      - ADMIN_PASSWORD=your-secure-password-here              # 请替换为强密码
    restart: unless-stopped