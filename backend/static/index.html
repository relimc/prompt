<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的图集 · 整理图片、提示词与工作流</title>
    <meta name="description" content="我的图集是一个AI提示词管理与工作流收集平台，支持瀑布流浏览、标签云分类和提示词备件库。上传ComfyUI生成的PNG图片可自动提取正负向提示词，手动编辑标签，快速复制组合提示词，高效组织AI绘画创作中的关键词与工作流。" />
    <meta name="keywords" content="我的图集,AI提示词,提示词管理,文生图,ComfyUI,提示词库,AI绘画,Prompt,标签云,提示词收录,自动提取提示词,工作流管理,提示词备件库,标签管理,AI绘画工具" />
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <div id="app">
        <!-- 顶栏 -->
        <div class="header-bar">
            <div class="logo" style="position:relative; display:inline-flex; align-items:center;">
                我的图集
                <span class="ai-badge-title">AI</span>
            </div>
            <input class="search-box" type="text" id="searchInput" placeholder="输入模型名/标题/提示词/标签来搜索图片" autocomplete="off" />
            <div class="view-toggle">
                <button class="view-btn active" data-view="waterfall" id="waterfallBtn">🌊 瀑布流</button>
                <button class="view-btn" data-view="tagcloud" id="tagcloudBtn">☁️ 标签云</button>
            </div>
        </div>

        <!-- 瀑布流容器 -->
        <div class="masonry" id="masonryGrid"></div>

        <!-- 分页控件 -->
        <div id="tagPagination" style="text-align:center;margin-top:24px;padding-bottom:20px;display:none;">
            <!-- 由 JS 动态生成 -->
        </div>

        <!-- 黑白名单抽屉（左侧） -->
        <div id="listDrawer" class="list-drawer">
            <div class="list-header">
                <span>📋 标签名单库</span>
                <button class="list-close">✕</button>
            </div>
            <div class="list-body">
                <!-- 白名单 -->
                <div class="list-section">
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <h4 style="margin:0;color:#059669;">白名单</h4>
                            <span class="info-icon" data-tip="加入白名单的标签将强制出现在标签云中，不受自动提取影响。">ⓘ</span>
                        </div>
                        <button class="list-import-btn" data-type="whitelist" title="导入白名单">📥</button>
                    </div>
                    <div id="whitelistContainer" style="display:flex;flex-wrap:wrap;gap:6px;min-height:40px;"></div>
                </div>

                <!-- 黑名单 -->
                <div class="list-section">
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <h4 style="margin:0;color:#dc2626;">黑名单</h4>
                            <span class="info-icon" data-tip="加入黑名单的标签将被自动过滤，不会出现在标签云中。">ⓘ</span>
                        </div>
                        <button class="list-import-btn" data-type="blacklist" title="导入黑名单">📥</button>
                    </div>
                    <div id="blacklistContainer" style="display:flex;flex-wrap:wrap;gap:6px;min-height:40px;"></div>
                </div>

                <!-- 停用词 -->
                <div class="list-section">
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <h4 style="margin:0;color:#8b5cf6;">停用词</h4>
                            <span class="info-icon" data-tip="停用词在标签提取阶段被过滤，用于去除无意义词汇。">ⓘ</span>
                        </div>
                        <button class="list-import-btn" data-type="stopword" title="导入停用词">📥</button>
                    </div>
                    <div id="stopwordsContainer" style="display:flex;flex-wrap:wrap;gap:6px;min-height:40px;"></div>
                </div>
            </div>
        </div>
        <!-- 名单库触发按钮 -->
        <button id="listToggleBtn" class="list-toggle-btn">📋</button>        

        <!-- 提示词备件库抽屉 -->
        <div id="draftDrawer" class="draft-drawer">
            <div class="draft-header">
                <span>📋 提示词备件库</span>
                <button class="draft-close">✕</button>
            </div>
            <div class="draft-body">
                <textarea id="draftTextarea" readonly placeholder="点击标签卡片上的 + 添加标签"></textarea>
            </div>
            <div class="draft-footer">
                <button class="draft-clear">清空</button>
                <button class="draft-copy">复制</button>
            </div>
        </div>
        <!-- 抽屉触发按钮（固定在屏幕右侧） -->
        <button id="draftToggleBtn" class="draft-toggle-btn">备</button>
        
    </div>

    <!-- 登录弹窗 -->
    <div id="loginModal" class="modal-overlay" style="display:none;">
        <div class="modal-box" style="max-width:400px;">
            <h2 style="margin-bottom:20px;">登录</h2>
            <input type="text" id="loginUsername" placeholder="用户名" class="form-input" style="margin-bottom:14px;" autocomplete="username" />
            <input type="password" id="loginPassword" placeholder="密码" class="form-input" style="margin-bottom:20px;" autocomplete="current-password" />
            <div style="display:flex; gap:12px;">
                <button id="loginConfirmBtn" class="btn-primary" style="flex:1;">确认登录</button>
                <button id="loginCancelBtn" class="btn-secondary" style="flex:1;">取消</button>
            </div>
            <div id="loginError" style="color:red;margin-top:14px;"></div>
        </div>
    </div>

    <!-- 新增/编辑弹窗 -->
    <div id="editModal" class="modal-overlay" style="display:none;">
        <div class="modal-box" style="max-width:600px;">
            <h2 id="editModalTitle">新增卡片</h2>
            <form id="editForm" enctype="multipart/form-data">
                <!-- 标题 -->
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" id="editTitle" name="title" class="form-input" placeholder="卡片标题（可选）" />
                </div>
                <!-- 正向提示词 -->
                <div class="form-group">
                    <label>正向提示词 *</label>
                    <textarea id="editPositive" name="positive_prompt" class="form-textarea" required placeholder="必填！您可自行输入正向提示词，也可以在下方PNG格式工作流中上传AI生图的图片原文件，系统会自动读取工作流中的提示词。"></textarea>
                </div>
                <!-- 负向提示词 -->
                <div class="form-group">
                    <label>负向提示词</label>
                    <textarea id="editNegative" name="negative_prompt" class="form-textarea" placeholder="负向提示词（可选）"></textarea>
                </div>
                <!-- 标签 -->
                <div class="form-group">
                    <label>标签</label>
                    <input type="text" id="editTags" name="tags" class="form-input" placeholder="标签（可选，逗号分隔）" />
                </div>
                <div class="form-group">
                    <label style="display:flex; align-items:center; gap:4px;">
                        <span>PNG格式工作流</span>
                        <span class="info-icon" data-tooltip="必选！一般为AI生图生成的图片。系统会自动读取AI生图中携带的提示词。当然，您也能上传纯图片来作为卡片的示例图，然后在正向提示词中输入对应的文本。">ⓘ</span>
                    </label>
                    <div style="display:flex; align-items:stretch; gap:8px; position:relative;">
                        <div style="flex:1; display:flex; align-items:center; border:1px solid #d1d5db; border-radius:12px; padding:12px 12px; background:white; position:relative;">
                            <span id="imageFileName" style="flex:1; color:#1e293b; font-size:0.95rem;">选择文件</span>
                            <input type="file" id="editImage" name="image" accept="image/*" style="position:absolute; inset:0; opacity:0; cursor:pointer;" />
                        </div>
                        <span id="editImagePreview" style="display:inline-flex; align-items:center;"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label style="display:flex; align-items:center; gap:4px;">
                        <span>JSON格式工作流</span>
                        <span class="info-icon" data-tooltip="可选。">ⓘ</span>
                    </label>
                    <div style="display:flex; align-items:stretch; gap:8px; position:relative;">
                        <div style="flex:1; display:flex; align-items:center; border:1px solid #d1d5db; border-radius:12px; padding:12px 12px; background:white; position:relative;">
                            <span id="workflowFileName" style="flex:1; color:#1e293b; font-size:0.95rem;">选择文件</span>
                            <input type="file" id="editWorkflow" name="workflow" accept=".json" style="position:absolute; inset:0; opacity:0; cursor:pointer;" />
                        </div>
                        <span id="editWorkflowPreview" style="display:inline-flex; align-items:center;"></span>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" id="editSaveBtn" class="btn-primary">保存</button>
                    <button type="button" id="editCancelBtn" class="btn-secondary">取消</button>
                    <button type="button" id="editDeleteBtn" class="btn-danger" style="display:none;">删除</button>
                </div>
                <input type="hidden" id="editPromptType" name="prompt_type" value="auto">
            </form>
        </div>
    </div>

    <!-- 提示词详情弹窗 -->
    <div id="promptModal" class="modal-overlay" style="display:none;">
        <div class="modal-box" style="max-width:600px; position:relative;">
            <button class="modal-close" id="modalCloseBtn">✕</button>
            <div class="modal-title" id="modalTitle">提示词详情</div>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- 候选提示词选择弹窗 -->
    <div id="candidateModal" class="modal-overlay" style="display:none;">
        <div class="modal-box" style="max-width:700px; display:flex; flex-direction:column; max-height:90vh;">
            <h2 style="text-align:center;margin-bottom:16px;">选择提示词</h2>
            <p style="color:#64748b;margin-bottom:16px;text-align:center;">点击「设为正向」或「设为反向」选择，可各选一个，点击确定生效</p>
            <div id="candidateList" style="flex:1;overflow-y:auto;border:1px solid #e2e8f0;border-radius:8px;padding:8px;margin-bottom:16px;">
                <!-- 动态生成 -->
            </div>
            <div id="candidateActions" style="display:flex;justify-content:flex-end;gap:12px;flex-shrink:0;">
                <!-- 按钮由 JS 动态生成 -->
            </div>
        </div>
    </div>


    <script src="/static/js/globals.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/models.js"></script>
    <script src="/static/js/tagcloud.js"></script>
    <script src="/static/js/draft.js"></script>
    <script src="/static/js/cards.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
